<svg xmlns="http://www.w3.org/2000/svg" width="800" height="541" viewBox="0 0 800 541" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="One question, five ways to answer it: Vertica&#x27;s bitmap database is first, 3.3 times ahead of ClickHouse&#x27;s bitmap functions for one user and 6.7 times with 32 users"><rect width="800" height="541" fill="#fcfcfb"/><text x="24.0" y="42.0" font-size="18" fill="#0b0b0b" font-weight="600">One question, five ways to answer it: Vertica&#x27;s bitmap database is first, 3.3</text><text x="24.0" y="66.0" font-size="18" fill="#0b0b0b" font-weight="600">times ahead of ClickHouse&#x27;s bitmap functions for one user and 6.7 times with</text><text x="24.0" y="90.0" font-size="18" fill="#0b0b0b" font-weight="600">32 users</text><text x="24.0" y="114.0" font-size="12.5" fill="#52514e">The question: how many consenting, active users in the country, aged 25 to 54, like sports or finance? 10 million</text><text x="24.0" y="131.0" font-size="12.5" fill="#52514e">people, 200 million interest rows; one machine, each engine limited to 20 CPUs and 56 GiB; median time of the recorded</text><text x="24.0" y="148.0" font-size="12.5" fill="#52514e">executions, shorter is faster; every answer checked against plain SQL</text><rect x="24.0" y="164" width="12" height="12" rx="3" fill="#104281"/><text x="42.0" y="174.0" font-size="12" fill="#52514e">Vertica, plain SQL</text><rect x="182.8" y="164" width="12" height="12" rx="3" fill="#86b6ef"/><text x="200.8" y="174.0" font-size="12" fill="#52514e">Vertica bitmap database, fenced</text><rect x="427.4" y="164" width="12" height="12" rx="3" fill="#2a78d6"/><text x="445.4" y="174.0" font-size="12" fill="#52514e">Vertica bitmap database, unfenced</text><rect x="24.0" y="184" width="12" height="12" rx="3" fill="#a3441c"/><text x="42.0" y="194.0" font-size="12" fill="#52514e">ClickHouse, plain SQL</text><rect x="202.6" y="184" width="12" height="12" rx="3" fill="#eb6834"/><text x="220.6" y="194.0" font-size="12" fill="#52514e">ClickHouse bitmap functions</text><text x="24.0" y="227.0" font-size="14" fill="#0b0b0b" font-weight="600">One user asks</text><text x="776.0" y="227.0" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="end"><tspan fill="#2a78d6">■</tspan> Vertica 3.3× faster</text><text x="266.0" y="250.0" font-size="12" fill="#52514e" text-anchor="end">Vertica, plain SQL</text><path d="M274.0,238 h408.0 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-408.0 z" fill="#104281"><title>Vertica, plain SQL: 666 ms</title></path><text x="692.0" y="250.0" font-size="12" fill="#0b0b0b">666 ms</text><text x="266.0" y="274.0" font-size="12" fill="#52514e" text-anchor="end">ClickHouse, plain SQL</text><path d="M274.0,262 h119.3 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-119.3 z" fill="#a3441c"><title>ClickHouse, plain SQL: 199 ms</title></path><text x="403.3" y="274.0" font-size="12" fill="#0b0b0b">199 ms</text><text x="266.0" y="298.0" font-size="12" fill="#52514e" text-anchor="end">ClickHouse bitmap functions</text><path d="M274.0,286 h21.7 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-21.7 z" fill="#eb6834"><title>ClickHouse bitmap functions: 42 ms</title></path><text x="305.7" y="298.0" font-size="12" fill="#0b0b0b">42 ms</text><text x="266.0" y="322.0" font-size="12" fill="#52514e" text-anchor="end">Vertica bitmap database, fenced</text><path d="M274.0,310 h14.9 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-14.9 z" fill="#86b6ef"><title>Vertica bitmap database, fenced: 31 ms</title></path><text x="298.9" y="322.0" font-size="12" fill="#0b0b0b">31 ms</text><text x="266.0" y="346.0" font-size="12" fill="#52514e" text-anchor="end">Vertica bitmap database, unfenced</text><path d="M274.0,334 h3.8 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-3.8 z" fill="#2a78d6"><title>Vertica bitmap database, unfenced: 13 ms</title></path><text x="287.8" y="346.0" font-size="12" fill="#0b0b0b">13 ms</text><line x1="274" y1="235" x2="274" y2="355" stroke="#c3c2b7"/><text x="24.0" y="383.0" font-size="14" fill="#0b0b0b" font-weight="600">32 users ask at once</text><text x="776.0" y="383.0" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="end"><tspan fill="#2a78d6">■</tspan> Vertica 6.7× faster</text><text x="266.0" y="406.0" font-size="12" fill="#52514e" text-anchor="end">Vertica, plain SQL</text><path d="M274.0,394 h408.0 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-408.0 z" fill="#104281"><title>Vertica, plain SQL: 3.56 s</title></path><text x="692.0" y="406.0" font-size="12" fill="#0b0b0b">3.56 s</text><text x="266.0" y="430.0" font-size="12" fill="#52514e" text-anchor="end">ClickHouse, plain SQL</text><path d="M274.0,418 h161.4 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-161.4 z" fill="#a3441c"><title>ClickHouse, plain SQL: 1.43 s</title></path><text x="445.4" y="430.0" font-size="12" fill="#0b0b0b">1.43 s</text><text x="266.0" y="454.0" font-size="12" fill="#52514e" text-anchor="end">ClickHouse bitmap functions</text><path d="M274.0,442 h30.4 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-30.4 z" fill="#eb6834"><title>ClickHouse bitmap functions: 297 ms</title></path><text x="314.4" y="454.0" font-size="12" fill="#0b0b0b">297 ms</text><text x="266.0" y="478.0" font-size="12" fill="#52514e" text-anchor="end">Vertica bitmap database, fenced</text><path d="M274.0,466 h9.9 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-9.9 z" fill="#86b6ef"><title>Vertica bitmap database, fenced: 120 ms</title></path><text x="293.9" y="478.0" font-size="12" fill="#0b0b0b">120 ms</text><text x="266.0" y="502.0" font-size="12" fill="#52514e" text-anchor="end">Vertica bitmap database, unfenced</text><path d="M274.0,490 h1.1 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-1.1 z" fill="#2a78d6"><title>Vertica bitmap database, unfenced: 44 ms</title></path><text x="285.1" y="502.0" font-size="12" fill="#0b0b0b">44 ms</text><line x1="274" y1="391" x2="274" y2="511" stroke="#c3c2b7"/></svg>
