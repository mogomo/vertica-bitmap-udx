<svg xmlns="http://www.w3.org/2000/svg" width="800" height="816" viewBox="0 0 800 816" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Inside Vertica, 32 users at once: the bitmap database answers the audience count 80 times faster than tuned plain SQL"><rect width="800" height="816" fill="#fcfcfb"/><text x="24.0" y="42.0" font-size="18" fill="#0b0b0b" font-weight="600">Inside Vertica, 32 users at once: the bitmap database answers the audience</text><text x="24.0" y="66.0" font-size="18" fill="#0b0b0b" font-weight="600">count 80 times faster than tuned plain SQL</text><text x="24.0" y="90.0" font-size="12.5" fill="#52514e">10 million people, 200 million interest rows; one machine, each engine limited to 20 CPUs and 56 GiB; median time of</text><text x="24.0" y="107.0" font-size="12.5" fill="#52514e">the recorded executions, shorter is faster; every answer checked against plain SQL</text><rect x="24.0" y="123" width="12" height="12" rx="3" fill="#104281"/><text x="42.0" y="133.0" font-size="12" fill="#52514e">Vertica, plain SQL</text><rect x="182.8" y="123" width="12" height="12" rx="3" fill="#86b6ef"/><text x="200.8" y="133.0" font-size="12" fill="#52514e">Vertica bitmap database, fenced</text><rect x="427.4" y="123" width="12" height="12" rx="3" fill="#2a78d6"/><text x="445.4" y="133.0" font-size="12" fill="#52514e">Vertica bitmap database, unfenced</text><text x="24.0" y="166.0" font-size="14" fill="#0b0b0b" font-weight="600">How many people are in this audience? (5 filters, 2 topics)</text><text x="776.0" y="166.0" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="end"><tspan fill="#2a78d6">■</tspan> Bitmap 80× faster</text><text x="266.0" y="189.0" font-size="12" fill="#52514e" text-anchor="end">Vertica, plain SQL</text><path d="M274.0,177 h408.0 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-408.0 z" fill="#104281"><title>Vertica, plain SQL: 3.56 s</title></path><text x="692.0" y="189.0" font-size="12" fill="#0b0b0b">3.56 s</text><text x="266.0" y="213.0" font-size="12" fill="#52514e" text-anchor="end">Vertica bitmap database, fenced</text><path d="M274.0,201 h9.9 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-9.9 z" fill="#86b6ef"><title>Vertica bitmap database, fenced: 120 ms</title></path><text x="293.9" y="213.0" font-size="12" fill="#0b0b0b">120 ms</text><text x="266.0" y="237.0" font-size="12" fill="#52514e" text-anchor="end">Vertica bitmap database, unfenced</text><path d="M274.0,225 h1.1 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-1.1 z" fill="#2a78d6"><title>Vertica bitmap database, unfenced: 44 ms</title></path><text x="285.1" y="237.0" font-size="12" fill="#0b0b0b">44 ms</text><line x1="274" y1="174" x2="274" y2="246" stroke="#c3c2b7"/><text x="24.0" y="274.0" font-size="14" fill="#0b0b0b" font-weight="600">How many distinct web users on each of two days?</text><text x="776.0" y="274.0" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="end"><tspan fill="#2a78d6">■</tspan> Bitmap 76× faster</text><text x="266.0" y="297.0" font-size="12" fill="#52514e" text-anchor="end">Vertica, plain SQL</text><path d="M274.0,285 h408.0 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-408.0 z" fill="#104281"><title>Vertica, plain SQL: 3.36 s</title></path><text x="692.0" y="297.0" font-size="12" fill="#0b0b0b">3.36 s</text><text x="266.0" y="321.0" font-size="12" fill="#52514e" text-anchor="end">Vertica bitmap database, fenced</text><path d="M274.0,309 h17.5 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-17.5 z" fill="#86b6ef"><title>Vertica bitmap database, fenced: 175 ms</title></path><text x="301.5" y="321.0" font-size="12" fill="#0b0b0b">175 ms</text><text x="266.0" y="345.0" font-size="12" fill="#52514e" text-anchor="end">Vertica bitmap database, unfenced</text><path d="M274.0,333 h1.4 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-1.4 z" fill="#2a78d6"><title>Vertica bitmap database, unfenced: 44 ms</title></path><text x="285.4" y="345.0" font-size="12" fill="#0b0b0b">44 ms</text><line x1="274" y1="282" x2="27