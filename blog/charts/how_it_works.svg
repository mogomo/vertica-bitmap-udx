<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="From source tables to an answer"><rect width="760" height="500" fill="#fcfcfb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><text x="24" y="42" font-size="18" fill="#0b0b0b" font-weight="600">From source tables to an answer</text><text x="24" y="64" font-size="13" fill="#52514e">The index is derived data: built per snapshot, checked against its source, then published.</text><rect x="24" y="88" width="222" height="112" rx="8" fill="#ffffff" stroke="#e4e3df" stroke-width="1.5"/><text x="36" y="110" font-size="13" fill="#0b0b0b" font-weight="600">1. Source tables</text><text x="36" y="130" font-size="12" fill="#52514e">profiles, interests, events,</text><text x="36" y="146" font-size="12" fill="#52514e">devices, assets</text><text x="36" y="162" font-size="12" fill="#52514e">(ordinary Vertica tables,</text><text x="36" y="178" font-size="12" fill="#52514e">one source snapshot per load)</text><rect x="269" y="88" width="222" height="112" rx="8" fill="#ffffff" stroke="#e4e3df" stroke-width="1.5"/><text x="281" y="110" font-size="13" fill="#0b0b0b" font-weight="600">2. Predicate families</text><text x="281" y="130" font-size="12" fill="#52514e">one SQL query per family that</text><text x="281" y="146" font-size="12" fill="#52514e">returns (predicate, entity ID):</text><text x="281" y="162" font-size="11" fill="#52514e" font-family="Menlo, Consolas, monospace">country_IL, age_25_54,</text><text x="281" y="178" font-size="11" fill="#52514e" font-family="Menlo, Consolas, monospace">topic_sports, ...</text><rect x="514" y="88" width="222" height="112" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="526" y="110" font-size="13" fill="#0b0b0b" font-weight="600">3. Build</text><text x="526" y="130" font-size="11" fill="#52514e" font-family="Menlo, Consolas, monospace">bm_build</text><text x="526" y="146" font-size="12" fill="#52514e">groups the IDs by predicate</text><text x="526" y="162" font-size="12" fill="#52514e">and ID chunk (65,536 IDs) into</text><text x="526" y="178" font-size="12" fill="#52514e">one compressed set per row</text><line x1="246" y1="144.0" x2="267" y2="144.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/><line x1="491" y1="144.0" x2="512" y2="144.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/><rect x="514" y="258" width="222" height="112" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="526" y="280" font-size="13" fill="#0b0b0b" font-weight="600">4. Index snapshot</text><text x="526" y="300" font-size="12" fill="#52514e">rows (predicate, chunk, payload)</text><text x="526" y="316" font-size="12" fill="#52514e">payload at most 8 KB</text><text x="526" y="332" font-size="12" fill="#52514e">state: building → verified</text><text x="526" y="348" font-size="12" fill="#52514e">→ active → retired</text><rect x="269" y="258" width="222" height="112" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="1.5"/><text x="281" y="280" font-size="13" fill="#0b0b0b" font-weight="600">5. Validate and publish</text><text x="281" y="300" font-size="12" fill="#52514e">every set is counted again from</text><text x="281" y="316" font-size="12" fill="#52514e">the source; one transaction</text><text x="281" y="332" font-size="12" fill="#52514e">makes the snapshot active;</text><text x="281" y="348" font-size="12" fill="#52514e">rollback = publish the old one</text><rect x="24" y="258" width="222" height="112" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/><text x="36" y="280" font-size="13" fill="#0b0b0b" font-weight="600">6. Readers</text><text x="36" y="300" font-size="12" fill="#52514e">views filtered by tenant and</text><text x="36" y="316" font-size="12" fill="#52514e">role; a query pins the active</text><text x="36" y="332" font-size="12" fill="#52514e">snapshot:</text><text x="36" y="348" font-size="11" fill="#52514e" font-family="Menlo, Consolas, monospace">bm_count, bm_ids, bm_facets</text><line x1="625.0" y1="200" x2="625.0" y2="256" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/><line x1="514" y1="314.0" x2="493" y2="314.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/><line x1="269" y1="314.0" x2="248" y2="314.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/><path d="M380.0,256 V229 H135.0 V203" fill="none" stroke="#1baf7a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="147.0" y="224" font-size="11" fill="#52514e">checked against the source</text><rect x="24" y="400" width="712" height="76" rx="8" fill="#f0efeb" stroke="#e4e3df" stroke-width="1.5"/><text x="36" y="422" font-size="13" fill="#0b0b0b" font-weight="600">Refresh</text><text x="36" y="442" font-size="12" fill="#52514e">A change batch (touch, add, remove) is applied to the active snapshot: only the changed chunks are rewritten, the rest is copied;</text><text x="36" y="458" font-size="12" fill="#52514e">the result is a new snapshot that goes through the same validation and publish. Readers of the old snapshot are never disturbed.</text></svg>
