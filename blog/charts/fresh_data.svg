<svg xmlns="http://www.w3.org/2000/svg" width="800" height="528" viewBox="0 0 800 528" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Fresh data while 32 users query: Vertica&#x27;s live index takes in 2 million rows in 3.9 s (ClickHouse: 2.9 s) and answers the audience count 1.3 times faster meanwhile"><rect width="800" height="528" fill="#fcfcfb"/><text x="24.0" y="42.0" font-size="18" fill="#0b0b0b" font-weight="600">Fresh data while 32 users query: Vertica&#x27;s live index takes in 2 million rows</text><text x="24.0" y="66.0" font-size="18" fill="#0b0b0b" font-weight="600">in 3.9 s (ClickHouse: 2.9 s) and answers the audience count 1.3 times faster</text><text x="24.0" y="90.0" font-size="18" fill="#0b0b0b" font-weight="600">meanwhile</text><text x="24.0" y="114.0" font-size="12.5" fill="#52514e">2 million new tag rows (1 % more data, every ID chunk) appended to sets that the engine maintains itself, during a</text><text x="24.0" y="131.0" font-size="12.5" fill="#52514e">mixed load of counts and facet breakdowns from 32 clients. No failed statement, no wrong answer, in either engine</text><rect x="24.0" y="147" width="12" height="12" rx="3" fill="#2a78d6"/><text x="42.0" y="157.0" font-size="12" fill="#52514e">Vertica live index</text><rect x="182.8" y="147" width="12" height="12" rx="3" fill="#eb6834"/><text x="200.8" y="157.0" font-size="12" fill="#52514e">ClickHouse live sets</text><text x="24.0" y="190.0" font-size="14" fill="#0b0b0b" font-weight="600">Append 2 million rows; the sets are exact at commit</text><text x="776.0" y="190.0" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="end"><tspan fill="#eb6834">■</tspan> ClickHouse 1.4× faster</text><text x="266.0" y="213.0" font-size="12" fill="#52514e" text-anchor="end">Vertica live index</text><path d="M274.0,201 h408.0 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-408.0 z" fill="#2a78d6"><title>Vertica live index: 3.9 s</title></path><text x="692.0" y="213.0" font-size="12" fill="#0b0b0b">3.9 s</text><text x="266.0" y="237.0" font-size="12" fill="#52514e" text-anchor="end">ClickHouse live sets</text><path d="M274.0,225 h300.1 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-300.1 z" fill="#eb6834"><title>ClickHouse live sets: 2.9 s</title></path><text x="584.1" y="237.0" font-size="12" fill="#0b0b0b">2.9 s</text><line x1="274" y1="198" x2="274" y2="246" stroke="#c3c2b7"/><text x="24.0" y="274.0" font-size="14" fill="#0b0b0b" font-weight="600">The audience count during that load (32 users)</text><text x="776.0" y="274.0" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="end"><tspan fill="#2a78d6">■</tspan> Vertica 1.3× faster</text><text x="266.0" y="297.0" font-size="12" fill="#52514e" text-anchor="end">Vertica live index</text><path d="M274.0,285 h319.7 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-319.7 z" fill="#2a78d6"><title>Vertica live index: 309 ms</title></path><text x="603.7" y="297.0" font-size="12" fill="#0b0b0b">309 ms</text><text x="266.0" y="321.0" font-size="12" fill="#52514e" text-anchor="end">ClickHouse live sets</text><path d="M274.0,309 h408.0 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-408.0 z" fill="#eb6834"><title>ClickHouse live sets: 393 ms</title></path><text x="692.0" y="321.0" font-size="12" fill="#0b0b0b">393 ms</text><line x1="274" y1="282" x2="274" y2="330" stroke="#c3c2b7"/><text x="24.0" y="358.0" font-size="14" fill="#0b0b0b" font-weight="600">The 500-topic breakdown during that load (32 users)</text><text x="776.0" y="358.0" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="end"><tspan fill="#eb6834">■</tspan> ClickHouse 1.3× faster</text><text x="266.0" y="381.0" font-size="12" fill="#52514e" text-anchor="end">Vertica live index</text><path d="M274.0,369 h408.0 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-408.0 z" fill="#2a78d6"><title>Vertica live index: 2.41 s</title></path><text x="692.0" y="381.0" font-size="12" fill="#0b0b0b">2.41 s</text><text x="266.0" y="405.0" font-size="12" fill="#52514e" text-anchor="end">ClickHouse live sets</text><path d="M274.0,393 h313.9 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-313.9 z" fill="#eb6834"><title>ClickHouse live sets: 1.86 s</title></path><text x="597.9" y="405.0" font-size="12" fill="#0b0b0b">1.86 s</text><line x1="274" y1="366" x2="274" y2="414" stroke="#c3c2b7"/><text x="24.0" y="442.0" font-size="14" fill="#0b0b0b" font-weight="600">Build all 698 sets from the source tables</text><text x="776.0" y="442.0" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="end"><tspan fill="#eb6834">■</tspan> ClickHouse 2.9× faster</text><text x="266.0" y="465.0" font-size="12" fill="#52514e" text-anchor="end">Vertica, aggregate builder</text><path d="M274.0,453 h408.0 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-408.0 z" fill="#2a78d6"><title>Vertica, aggregate builder: 8.3 s</title></path><text x="692.0" y="465.0" font-size="12" fill="#0b0b0b">8.3 s</text><text x="266.0" y="489.0" font-size="12" fill="#52514e" text-anchor="end">ClickHouse, groupBitmap</text><path d="M274.0,477 h138.9 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-138.9 z" fill="#eb6834"><title>ClickHouse, groupBitmap: 2.9 s</title></path><text x="422.9" y="489.0" font-size="12" fill="#0b0b0b">2.9 s</text><line x1="274" y1="450" x2="274" y2="498" stroke="#c3c2b7"/></svg>
