<svg xmlns="http://www.w3.org/2000/svg" width="800" height="833" viewBox="0 0 800 833" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Vertica against ClickHouse, 32 users at once: Vertica&#x27;s bitmap database answers the audience count 6.7 times faster"><rect width="800" height="833" fill="#fcfcfb"/><text x="24.0" y="42.0" font-size="18" fill="#0b0b0b" font-weight="600">Vertica against ClickHouse, 32 users at once: Vertica&#x27;s bitmap database</text><text x="24.0" y="66.0" font-size="18" fill="#0b0b0b" font-weight="600">answers the audience count 6.7 times faster</text><text x="24.0" y="90.0" font-size="12.5" fill="#52514e">Same data, same machine, same limits, one engine running at a time, identical answers. 10 million people, 200 million</text><text x="24.0" y="107.0" font-size="12.5" fill="#52514e">interest rows; one machine, each engine limited to 20 CPUs and 56 GiB; median time of the recorded executions, shorter</text><text x="24.0" y="124.0" font-size="12.5" fill="#52514e">is faster; every answer checked against plain SQL</text><rect x="24.0" y="140" width="12" height="12" rx="3" fill="#86b6ef"/><text x="42.0" y="150.0" font-size="12" fill="#52514e">Vertica bitmap database, fenced</text><rect x="268.6" y="140" width="12" height="12" rx="3" fill="#2a78d6"/><text x="286.6" y="150.0" font-size="12" fill="#52514e">Vertica bitmap database, unfenced</text><rect x="526.4" y="140" width="12" height="12" rx="3" fill="#eb6834"/><text x="544.4" y="150.0" font-size="12" fill="#52514e">ClickHouse bitmap functions</text><text x="24.0" y="183.0" font-size="14" fill="#0b0b0b" font-weight="600">How many people are in this audience? (5 filters, 2 topics)</text><text x="776.0" y="183.0" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="end"><tspan fill="#2a78d6">■</tspan> Vertica 6.7× faster</text><text x="266.0" y="206.0" font-size="12" fill="#52514e" text-anchor="end">Vertica bitmap database, unfenced</te