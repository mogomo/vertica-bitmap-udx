<svg xmlns="http://www.w3.org/2000/svg" width="800" height="708" viewBox="0 0 800 708" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The people behind the count, 32 users at once: Vertica&#x27;s bitmap database is faster in 4 of 5 uses, level in 1"><rect width="800" height="708" fill="#fcfcfb"/><text x="24.0" y="42.0" font-size="18" fill="#0b0b0b" font-weight="600">The people behind the count, 32 users at once: Vertica&#x27;s bitmap database is</text><text x="24.0" y="66.0" font-size="18" fill="#0b0b0b" font-weight="600">faster in 4 of 5 uses, level in 1</text><text x="24.0" y="90.0" font-size="12.5" fill="#52514e">An audience of 530,315 people out of 10 million. Both engines are read the same way: the clock stops when the last</text><text x="24.0" y="107.0" font-size="12.5" fill="#52514e">byte of the answer has arrived. Same machine and limits; median time, shorter is faster</text><rect x="24.0" y="123" width="12" height="12" rx="3" fill="#86b6ef"/><text x="42.0" y="133.0" font-size="12" fill="#52514e">Vertica bitmap database, fenced</text><rect x="268.6" y="123" width="12" height="12" rx="3" fill="#2a78d6"/><text x="286.6" y="133.0" font-size="12" fill="#52514e">Vertica bitmap database, unfenced</text><rect x="526.4" y="123" width="12" height="12" rx="3" fill="#eb6834"/><text x="544.4" y="133.0" font-size="12" fill="#52514e">ClickHouse bitmap functions</text><text x="24.0" y="166.0" font-size="14" fill="#0b0b0b" font-weight="600">Use the list inside the database (count and sum of the IDs)</text><text x="776.0" y="166.0" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="end"><tspan fill="#2a78d6">■</tspan> Vertica 4.2× faster</text><text x="266.0" y="189.0" font-size="12" fill="#52514e" text-anchor="end">Vertica bitmap database, unfenced</text><path d="M274.0,177 h95.3 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-95.3 z" fill="#2a78d6"><title>Vertica bitmap database, unfenced: 59 ms</title></path><text x="379.3" y="189.0" font-size="12" fill="#0b0b0b">59 ms</text><text x="266.0" y="213.0" font-size="12" fill="#52514e" text-anchor="end">Vertica bitmap database, fenced</text><path d="M274.0,201 h268.2 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-268.2 z" fill="#86b6ef"><title>Vertica bitmap database, fenced: 161 ms</title></path><text x="552.2" y="213.0" font-size="12" fill="#0b0b0b">161 ms</text><text x="266.0" y="237.0" font-size="12" fill="#52514e" text-anchor="end">ClickHouse bitmap functions</text><path d="M274.0,225 h408.0 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-408.0 z" fill="#eb6834"><title>ClickHouse bitmap functions: 244 ms</title></path><text x="692.0" y="237.0" font-size="12" fill="#0b0b0b">244 ms</text><line x1="274" y1="174" x2="274" y2="246" stroke="#c3c2b7"/><text x="24.0" y="274.0" font-size="14" fill="#0b0b0b" font-weight="600">Send the list as text blocks (ClickHouse: its row stream)</text><text x="776.0" y="274.0" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="end"><tspan fill="#2a78d6">■</tspan> Vertica 2.6× faster</text><text x="266.0" y="297.0" font-size="12" fill="#52514e" text-anchor="end">Vertica bitmap database, unfenced</text><path d="M274.0,285 h154.9 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-154.9 z" fill="#2a78d6"><title>Vertica bitmap database, unfenced: 93 ms</title></path><text x="438.9" y="297.0" font-size="12" fill="#0b0b0b">93 ms</text><text x="266.0" y="321.0" font-size="12" fill="#52514e" text-anchor="end">Vertica bitmap database, fenced</text><path d="M274.0,309 h272.1 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-272.1 z" fill="#86b6ef"><title>Vertica bitmap database, fenced: 162 ms</title></path><text x="556.1" y="321.0" font-size="12" fill="#0b0b0b">162 ms</text><text x="266.0" y="345.0" font-size="12" fill="#52514e" text-anchor="end">ClickHouse bitmap functions</text><path d="M274.0,333 h408.0 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-408.0 z" fill="#eb6834"><title>ClickHouse bitmap functions: 242 ms</title></path><text x="692.0" y="345.0" font-s