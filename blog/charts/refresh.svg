<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Vertica&#x27;s validated snapshots: a change of 1 % of the people is applied in 51 s instead of a 111 s rebuild"><rect width="800" height="420" fill="#fcfcfb"/><text x="24.0" y="42.0" font-size="18" fill="#0b0b0b" font-weight="600">Vertica&#x27;s validated snapshots: a change of 1 % of the people is applied in 51</text><text x="24.0" y="66.0" font-size="18" fill="#0b0b0b" font-weight="600">s instead of a 111 s rebuild</text><text x="24.0" y="90.0" font-size="12.5" fill="#52514e">10 million people, 1 % changed; seconds, including the validation of every set against the source; the incremental</text><text x="24.0" y="107.0" font-size="12.5" fill="#52514e">result equals the full rebuild byte for byte</text><rect x="24.0" y="123" width="12" height="12" rx="3" fill="#86b6ef"/><text x="42.0" y="133.0" font-size="12" fill="#52514e">Vertica: full rebuild</text><rect x="202.6" y="123" width="12" height="12" rx="3" fill="#2a78d6"/><text x="220.6" y="133.0" font-size="12" fill="#52514e">Vertica: incremental refresh</text><text x="24.0" y="166.0" font-size="14" fill="#0b0b0b" font-weight="600">Changes reported as add / remove (198,219 changes)</text><text x="776.0" y="166.0" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="end"><tspan fill="#2a78d6">■</tspan> Incremental 2.2× faster</text><text x="266.0" y="189.0" font-size="12" fill="#52514e" text-anchor="end">Full rebuild</text><path d="M274.0,177 h408.0 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-408.0 z" fill="#86b6ef"><title>Full rebuild: 111 s</title></path><text x="692.0" y="189.0" font-size="12" fill="#0b0b0b">111 s</text><text x="266.0" y="213.0" font-size="12" fill="#52514e" text-anchor="end">Incremental refresh</text><path d="M274.0,201 h186.8 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-186.8 z" fill="#2a78d6"><title>Incremental refresh: 51 s</title></path><text x="470.8" y="213.0" font-size="12" fill="#0b0b0b">51 s</text><line x1="274" y1="174" x2="274" y2="222" stroke="#c3c2b7"/><text x="24.0" y="250.0" font-size="14" fill="#0b0b0b" font-weight="600">Changes on recent sign-ups (2 of 153 ID chunks)</text><text x="776.0" y="250.0" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="end"><tspan fill="#2a78d6">■</tspan> Incremental 1.8× faster</text><text x="266.0" y="273.0" font-size="12" fill="#52514e" text-anchor="end">Full rebuild</text><path d="M274.0,261 h408.0 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-408.0 z" fill="#86b6ef"><title>Full rebuild: 108 s</title></path><text x="692.0" y="273.0" font-size="12" fill="#0b0b0b">108 s</text><text x="266.0" y="297.0" font-size="12" fill="#52514e" text-anchor="end">Incremental refresh</text><path d="M274.0,285 h225.1 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-225.1 z" fill="#2a78d6"><title>Incremental refresh: 60 s</title></path><text x="509.1" y="297.0" font-size="12" fill="#0b0b0b">60 s</text><line x1="274" y1="258" x2="274" y2="306" stroke="#c3c2b7"/><text x="24.0" y="334.0" font-size="14" fill="#0b0b0b" font-weight="600">&quot;This person changed&quot;, spread over every chunk</text><text x="776.0" y="334.0" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="end">Level</text><text x="266.0" y="357.0" font-size="12" fill="#52514e" text-anchor="end">Full rebuild</text><path d="M274.0,345 h400.1 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-400.1 z" fill="#86b6ef"><title>Full rebuild: 108 s</title></path><text x="684.1" y="357.0" font-size="12" fill="#0b0b0b">108 s</text><text x="266.0" y="381.0" font-size="12" fill="#52514e" text-anchor="end">Incremental refresh</text><path d="M274.0,369 h408.0 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-408.0 z" fill="#2a78d6"><title>Incremental refresh: 110 s</title></path><text x="692.0" y="381.0" font-size="12" fill="#0b0b0b">110 s</text><line x1="274" y1="342" x2="274" y2="390" stroke="#c3c2b7"/></svg>
